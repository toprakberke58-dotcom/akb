<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sana küçük bir şey hazırladım</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stars" aria-hidden="true"></div>

  <main class="card">
    <div class="terminal-tag" id="terminalTag">SYSTEM MESSAGE // TOPRAK</div>
    <div class="terminal" id="terminal">
      <p class="prompt">&gt; yeni_mesaj.exe başlatılıyor...</p>
      <p class="prompt">&gt; alıcı: sen</p>
      <p class="prompt">&gt; küçük bir sır bulundu.</p>
      <p class="prompt blink">&gt; devam etmek için hazır ol.</p>
      <button id="startButton" type="button">Mesajı aç →</button>
    </div>

    <section class="content hidden" id="content">
      <div class="heart" aria-hidden="true">♥</div>
      <p class="eyebrow" id="stepLabel">BİR KÜÇÜK NOT</p>
      <h1 id="heading">Merhaba, ben Toprak.</h1>
      <p id="message">Sana küçük bir şey hazırladım. Sonuna kadar bakmak ister misin?</p>
      <button id="nextButton" type="button">Başlayalım →</button>
      <p class="step-count" id="stepCount">01 / 04</p>
    </section>

    <footer>özenle hazırlandı · Toprak</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
